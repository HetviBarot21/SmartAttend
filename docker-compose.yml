# Tier 2 (server/) only. See server/.env.example for all variables.
services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # Keep the database on the named volume.
      DB_PATH: /data/smartattend.db
      # Uncomment once the local API-Gateway shim (or real AWS) exists:
      # SYNC_API_GATEWAY_URL: http://host.docker.internal:4000/sync
    volumes:
      - smartattend-db:/data
    restart: unless-stopped

volumes:
  smartattend-db:
